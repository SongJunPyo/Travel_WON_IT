# 테스트는 MySQL 없이 H2 메모리 DB(MySQL 모드)로 돕니다. config/ 위치라 본 application.properties 값 중 DB만 덮어씁니다.
spring.datasource.url=jdbc:h2:mem:wonhae-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
