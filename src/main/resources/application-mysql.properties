# MySQL(travel_won)로 실행: npm run server:mysql 또는 --spring.profiles.active=mysql
# 주소·계정·비밀번호는 .env 또는 환경변수로만 넣습니다 (이 파일·Git에 적지 않습니다).
#   DB_URL=jdbc:mysql://<호스트>:3306/travel_won?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#   DB_USERNAME=...   DB_PASSWORD=...
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# DB 설계를 마칠 때까지 테이블을 자동으로 만들거나 바꾸지 않습니다.
spring.jpa.hibernate.ddl-auto=none
