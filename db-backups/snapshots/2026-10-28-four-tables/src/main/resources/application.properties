spring.application.name=travel-wonhae
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8787}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Spring AI · Anthropic. 키는 .env 또는 환경 변수 ANTHROPIC_API_KEY에서만 읽습니다. 없으면 가짜 값으로 앱만 띄웁니다.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:no-key}
spring.ai.anthropic.chat.model=${AI_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.max-tokens=16000
spring.ai.anthropic.timeout=60s
spring.ai.anthropic.max-retries=0

# 기본 실행은 H2 파일 DB입니다. MySQL은 mysql 프로필(application-mysql.properties)에서만
# DB_URL·DB_USERNAME·DB_PASSWORD로 연결합니다. .env에 DB 값이 있어도 기본 실행은 MySQL을 쓰지 않습니다.
spring.datasource.url=jdbc:h2:file:./data/prices
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-float-as-int=false
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
# 환율: 한국수출입은행 현재환율 API. 키는 .env 또는 환경 변수 KOREAEXIM_API_KEY에서만 읽습니다. 없으면 환율 불러오기만 RATE_UNAVAILABLE로 거절됩니다.
app.exchange-rate.url=${EXCHANGE_RATE_URL:https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON}
